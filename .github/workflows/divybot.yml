name: divybot
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  matrix-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.6
      - name: Dispatcher and bridge tests
        run: go test -race ./...
      - name: Isolated owner endpoint two-UID kernel test
        run: |
          proof_dir="$(mktemp -d)"
          trap 'rm -rf "$proof_dir"' EXIT
          chmod 0711 "$proof_dir"
          go test -race -c -o "$proof_dir/endpoint.test" ./cmd/divybot
          sudo env PATH="$PATH" TMPDIR=/tmp OWNER_ENDPOINT_REQUIRE_ROOT=1 "$proof_dir/endpoint.test" -test.run '^TestOwnerNativeEndpointTwoUIDs$' -test.v -test.count=1
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/divybot
